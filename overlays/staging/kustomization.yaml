apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: selaras-staging

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: selaras-ingress
      spec:
        rules:
          - host: api-stg.selaras.hospital.id
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: bff-web
                      port:
                        number: 8080
          - host: mobile-stg.selaras.hospital.id
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: bff-mobile
                      port:
                        number: 8081
          - host: b2b-stg.selaras.hospital.id
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: b2b-gateway
                      port:
                        number: 8082
    target:
      kind: Ingress
      name: selaras-ingress
