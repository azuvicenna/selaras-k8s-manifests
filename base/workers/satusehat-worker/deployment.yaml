apiVersion: apps/v1
kind: Deployment
metadata:
  name: satusehat-worker
  namespace: selaras
  labels:
    app.kubernetes.io/name: satusehat-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: satusehat-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: satusehat-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9095"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: satusehat-worker
          image: azuvicenna/selaras-satusehat-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
            - name: metrics
              containerPort: 9095
          env:
            - name: HTTP_PORT
              value: "8085"
            - name: METRICS_PORT
              value: "9095"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: RABBITMQ_URL
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: SATUSEHAT_QUEUE
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: RABBITMQ_SATUSEHAT_EXCHANGE
            - name: RABBITMQ_ROUTING_KEY
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: SATUSEHAT_ROUTING_KEY
            - name: RABBITMQ_DLQ
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: SATUSEHAT_DLQ
            - name: SATUSEHAT_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: SATUSEHAT_AUTH_URL
            - name: SATUSEHAT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: SATUSEHAT_BASE_URL
            - name: SATUSEHAT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: SATUSEHAT_CLIENT_ID
            - name: SATUSEHAT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: SATUSEHAT_CLIENT_SECRET
            - name: SATUSEHAT_ORG_ID
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: SATUSEHAT_ORG_ID
            - name: EMR_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: EMR_SERVICE_ADDR
            - name: MASTER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: MASTER_SERVICE_ADDR
            - name: WORKER_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
