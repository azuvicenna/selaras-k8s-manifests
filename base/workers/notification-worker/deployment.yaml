apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: selaras
  labels:
    app.kubernetes.io/name: notification-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9097"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: notification-worker
          image: azuvicenna/selaras-notification-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
            - name: metrics
              containerPort: 9097
          env:
            - name: HTTP_PORT
              value: "8087"
            - name: METRICS_PORT
              value: "9097"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: RABBITMQ_URL
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: NOTIFICATION_QUEUE
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: RABBITMQ_NOTIFICATION_EXCHANGE
            - name: RABBITMQ_ROUTING_KEY
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: NOTIFICATION_ROUTING_KEY
            - name: RABBITMQ_DLQ
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: NOTIFICATION_DLQ
            - name: WHATSAPP_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: WHATSAPP_PROVIDER
            - name: EMAIL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: EMAIL_PROVIDER
            - name: WORKER_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 5
