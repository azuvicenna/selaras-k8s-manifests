apiVersion: apps/v1
kind: Deployment
metadata:
  name: bpjs-worker
  namespace: selaras
  labels:
    app.kubernetes.io/name: bpjs-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bpjs-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bpjs-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9096"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: bpjs-worker
          image: azuvicenna/selaras-bpjs-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
            - name: metrics
              containerPort: 9096
          env:
            - name: HTTP_PORT
              value: "8086"
            - name: METRICS_PORT
              value: "9096"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: RABBITMQ_URL
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BPJS_QUEUE
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: RABBITMQ_BPJS_EXCHANGE
            - name: RABBITMQ_ROUTING_KEY
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BPJS_ROUTING_KEY
            - name: RABBITMQ_DLQ
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BPJS_DLQ
            - name: BPJS_CONS_ID
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: BPJS_CONS_ID
            - name: BPJS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: BPJS_SECRET_KEY
            - name: BPJS_USER_KEY
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: BPJS_USER_KEY
            - name: BPJS_VCLAIM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BPJS_VCLAIM_BASE_URL
            - name: BPJS_ANTREAN_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BPJS_ANTREAN_BASE_URL
            - name: BPJS_APLICARES_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BPJS_APLICARES_BASE_URL
            - name: BPJS_KODE_PPK
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BPJS_KODE_PPK
            - name: EMR_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: EMR_SERVICE_ADDR
            - name: BED_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: BED_SERVICE_ADDR
            - name: MASTER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: MASTER_SERVICE_ADDR
            - name: WORKER_CONCURRENCY
              value: "5"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 5
