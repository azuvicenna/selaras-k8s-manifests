apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff-mobile-hpa
  namespace: selaras
  labels:
    app.kubernetes.io/name: bff-mobile
    app.kubernetes.io/part-of: selaras-simrs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff-mobile
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
