apiVersion: apps/v1
kind: Deployment
metadata:
  name: bed-service
  namespace: selaras
  labels:
    app.kubernetes.io/name: bed-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bed-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bed-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9095"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: bed-service
          image: azuvicenna/selaras-bed-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50054
            - name: metrics
              containerPort: 9095
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_PORT
            - name: DB_USER
              value: "bed"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: DB_PASSWORD_BED
            - name: DB_NAME
              value: "bed_db"
            - name: GRPC_PORT
              value: "50054"
            - name: METRICS_PORT
              value: "9095"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 5
