apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: selaras
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9099"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: billing-service
          image: azuvicenna/selaras-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50058
            - name: metrics
              containerPort: 9099
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_PORT
            - name: DB_USER
              value: "billing"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: DB_PASSWORD_BILLING
            - name: DB_NAME
              value: "billing_db"
            - name: DATABASE_URL
              value: "postgres://billing:change-me@postgres.selaras.svc.cluster.local:5432/billing_db?sslmode=disable"
            - name: GRPC_PORT
              value: "50058"
            - name: METRICS_PORT
              value: "9099"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 50058
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50058
            initialDelaySeconds: 5
            periodSeconds: 5
