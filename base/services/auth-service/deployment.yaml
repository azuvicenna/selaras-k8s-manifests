apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: selaras
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9098"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: auth-service
          image: azuvicenna/selaras-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50057
            - name: metrics
              containerPort: 9098
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_PORT
            - name: DB_USER
              value: "auth"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: DB_PASSWORD_AUTH
            - name: DB_NAME
              value: "auth_db"
            - name: DATABASE_URL
              value: "postgres://auth:change-me@postgres.selaras.svc.cluster.local:5432/auth_db?sslmode=disable"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: REDIS_ADDR
            - name: GRPC_PORT
              value: "50057"
            - name: METRICS_PORT
              value: "9098"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: JWT_SECRET
            - name: JWT_ACCESS_EXPIRY
              value: "15m"
            - name: JWT_REFRESH_EXPIRY
              value: "168h"
            - name: CAPTCHA_EXPIRY
              value: "5m"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 50057
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50057
            initialDelaySeconds: 5
            periodSeconds: 5
