apiVersion: apps/v1
kind: Deployment
metadata:
  name: emr-service
  namespace: selaras
  labels:
    app.kubernetes.io/name: emr-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emr-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emr-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: emr-service
          image: azuvicenna/selaras-emr-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
            - name: metrics
              containerPort: 9093
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_PORT
            - name: DB_USER
              value: "emr"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: DB_PASSWORD_EMR
            - name: DB_NAME
              value: "emr_db"
            - name: GRPC_PORT
              value: "50052"
            - name: METRICS_PORT
              value: "9093"
            - name: STORAGE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: STORAGE_ENDPOINT
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: MINIO_ROOT_USER
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: STORAGE_BUCKET_EMR
            - name: STORAGE_USE_SSL
              value: "false"
            - name: PATIENT_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: PATIENT_SERVICE_ADDR
            - name: MASTER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: MASTER_SERVICE_ADDR
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 5
