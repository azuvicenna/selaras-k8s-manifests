apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: selaras
  labels:
    app.kubernetes.io/name: document-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9103"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: document-service
          image: azuvicenna/selaras-document-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50062
            - name: metrics
              containerPort: 9103
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_PORT
            - name: DB_USER
              value: "document"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: DB_PASSWORD_DOCUMENT
            - name: DB_NAME
              value: "document_db"
            - name: DATABASE_URL
              value: "postgres://document:change-me@postgres.selaras.svc.cluster.local:5432/document_db?sslmode=disable"
            - name: GRPC_PORT
              value: "50062"
            - name: METRICS_PORT
              value: "9103"
            - name: TYPST_BIN_PATH
              value: "typst"
            - name: VERIFY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: VERIFY_BASE_URL
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 50062
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50062
            initialDelaySeconds: 5
            periodSeconds: 5
