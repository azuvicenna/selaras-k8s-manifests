apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-service
  namespace: selaras
  labels:
    app.kubernetes.io/name: pharmacy-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: selaras-simrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pharmacy-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharmacy-service
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: selaras-simrs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pharmacy-service
          image: azuvicenna/selaras-pharmacy-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50059
            - name: metrics
              containerPort: 9100
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: selaras-config
                  key: DB_PORT
            - name: DB_USER
              value: "pharmacy"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: DB_PASSWORD_PHARMACY
            - name: DB_NAME
              value: "pharmacy_db"
            - name: DATABASE_URL
              value: "postgres://pharmacy:change-me@postgres.selaras.svc.cluster.local:5432/pharmacy_db?sslmode=disable"
            - name: GRPC_PORT
              value: "50059"
            - name: METRICS_PORT
              value: "9100"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 50059
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50059
            initialDelaySeconds: 5
            periodSeconds: 5
