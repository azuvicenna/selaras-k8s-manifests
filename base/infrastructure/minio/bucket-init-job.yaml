apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-buckets
  namespace: selaras
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/component: init-job
    app.kubernetes.io/part-of: selaras-simrs
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_USER
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_PASS
              valueFrom:
                secretKeyRef:
                  name: selaras-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              until /usr/bin/mc alias set selaras http://minio.selaras.svc.cluster.local:9000 "$MINIO_USER" "$MINIO_PASS"; do
                echo "Waiting for MinIO service to become ready..."
                sleep 3
              done
              echo "Creating buckets..."
              /usr/bin/mc mb --ignore-existing selaras/patient-documents
              /usr/bin/mc mb --ignore-existing selaras/emr-documents
              /usr/bin/mc mb --ignore-existing selaras/medical-documents
              /usr/bin/mc anonymous set download selaras/medical-documents
              echo "MinIO buckets initialized successfully!"
