# PETUNJUK: Salin file ini menjadi secret.yaml atau gunakan SealedSecret / ExternalSecrets Operator.
# JANGAN PERNAH commit secret dengan password produksi ke repositori Git publik!
apiVersion: v1
kind: Secret
metadata:
  name: selaras-secrets
  namespace: selaras
  labels:
    app.kubernetes.io/part-of: selaras-simrs
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "<GENERATE_STRONG_POSTGRES_ROOT_PASSWORD>"
  DB_PASSWORD_AUTH: "<GENERATE_PASSWORD_AUTH>"
  DB_PASSWORD_PATIENT: "<GENERATE_PASSWORD_PATIENT>"
  DB_PASSWORD_PRACTITIONER: "<GENERATE_PASSWORD_PRACTITIONER>"
  DB_PASSWORD_ADMISSION: "<GENERATE_PASSWORD_ADMISSION>"
  DB_PASSWORD_BED: "<GENERATE_PASSWORD_BED>"
  DB_PASSWORD_MASTER: "<GENERATE_PASSWORD_MASTER>"
  DB_PASSWORD_EMR: "<GENERATE_PASSWORD_EMR>"
  DB_PASSWORD_BILLING: "<GENERATE_PASSWORD_BILLING>"
  DB_PASSWORD_PHARMACY: "<GENERATE_PASSWORD_PHARMACY>"
  DB_PASSWORD_LABORATORY: "<GENERATE_PASSWORD_LABORATORY>"
  DB_PASSWORD_RADIOLOGY: "<GENERATE_PASSWORD_RADIOLOGY>"
  DB_PASSWORD_DOCUMENT: "<GENERATE_PASSWORD_DOCUMENT>"

  # MinIO Credentials
  MINIO_ROOT_USER: "<MINIO_ROOT_USER>"
  MINIO_ROOT_PASSWORD: "<MINIO_ROOT_PASSWORD>"

  # RabbitMQ Credentials
  RABBITMQ_DEFAULT_USER: "selaras"
  RABBITMQ_DEFAULT_PASS: "<RABBITMQ_SECURE_PASSWORD>"
  RABBITMQ_URL: "amqp://selaras:<RABBITMQ_SECURE_PASSWORD>@rabbitmq.selaras.svc.cluster.local:5672/"

  # JWT & API Keys
  JWT_SECRET: "<MINIMAL_32_CHAR_RANDOM_SECRET_KEY>"
  B2B_API_KEY_SECRET: "<MINIMAL_32_CHAR_B2B_SALT_KEY>"

  # BPJS Bridging Credentials
  BPJS_CONS_ID: "<BPJS_CONS_ID>"
  BPJS_SECRET_KEY: "<BPJS_SECRET_KEY>"
  BPJS_USER_KEY: "<BPJS_USER_KEY>"

  # SATUSEHAT Credentials
  SATUSEHAT_CLIENT_ID: "<SATUSEHAT_CLIENT_ID>"
  SATUSEHAT_CLIENT_SECRET: "<SATUSEHAT_CLIENT_SECRET>"
