apiVersion: v1
kind: Secret
metadata:
  name: selaras-secrets
  namespace: selaras
  labels:
    app.kubernetes.io/part-of: selaras-simrs
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-me-in-production"
  DB_PASSWORD_AUTH: "change-me"
  DB_PASSWORD_PATIENT: "change-me"
  DB_PASSWORD_PRACTITIONER: "change-me"
  DB_PASSWORD_ADMISSION: "change-me"
  DB_PASSWORD_BED: "change-me"
  DB_PASSWORD_MASTER: "change-me"
  DB_PASSWORD_EMR: "change-me"
  DB_PASSWORD_BILLING: "change-me"
  DB_PASSWORD_PHARMACY: "change-me"
  DB_PASSWORD_LABORATORY: "change-me"
  DB_PASSWORD_RADIOLOGY: "change-me"
  DB_PASSWORD_DOCUMENT: "change-me"

  # MinIO Credentials
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin-secure-password"

  # RabbitMQ Credentials
  RABBITMQ_DEFAULT_USER: "selaras"
  RABBITMQ_DEFAULT_PASS: "selaras123"
  RABBITMQ_URL: "amqp://selaras:selaras123@rabbitmq.selaras.svc.cluster.local:5672/"

  # JWT & API Keys
  JWT_SECRET: "selaras-hospital-jwt-secret-key-32bytes!"
  B2B_API_KEY_SECRET: "selaras-b2b-secret-salt-key-32bytes!"

  # BPJS Bridging Credentials
  BPJS_CONS_ID: "12345"
  BPJS_SECRET_KEY: "bpjs-secret-key-32chars-example"
  BPJS_USER_KEY: "bpjs-user-key-trustmark-dev"

  # SATUSEHAT Credentials
  SATUSEHAT_CLIENT_ID: "satusehat-demo-client-id"
  SATUSEHAT_CLIENT_SECRET: "satusehat-demo-client-secret"
