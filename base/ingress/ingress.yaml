apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: selaras-ingress
  namespace: selaras
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: selaras-simrs
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  rules:
    # Web Portal & Primary Clinical BFF API
    - host: api.selaras.hospital.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff-web
                port:
                  number: 8080

    # Mobile App BFF API
    - host: mobile-api.selaras.hospital.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff-mobile
                port:
                  number: 8081

    # B2B & External Partner Gateway
    - host: b2b.selaras.hospital.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: b2b-gateway
                port:
                  number: 8082

    # MinIO Storage & Console
    - host: storage.selaras.hospital.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
    - host: minio-console.selaras.hospital.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001

    # RabbitMQ Management Console
    - host: rabbitmq.selaras.hospital.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672

    # Grafana Dashboard
    - host: grafana.selaras.hospital.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
